<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1200px;
            height: 630px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #000a2e 0%, #1e3a8a 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .content {
            text-align: center;
            z-index: 2;
            padding: 60px;
        }
        .logo-container {
            margin-bottom: 40px;
        }
        .logo-container img {
            height: 120px;
            width: auto;
        }
        h1 {
            font-size: 72px;
            font-weight: 800;
            color: white;
            margin-bottom: 24px;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        .highlight {
            color: #3b82f6;
        }
        p {
            font-size: 32px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            line-height: 1.4;
            max-width: 900px;
            margin: 0 auto;
        }
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image:
                repeating-linear-gradient(45deg, transparent, transparent 50px, rgba(255,255,255,.03) 50px, rgba(255,255,255,.03) 100px);
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="content">
        <div class="logo-container">
            <img src="logo-transparent.png" alt="America First">
        </div>
        <h1>America <span class="highlight">First</span></h1>
        <p>Civic Education & Advocacy</p>
    </div>
</body>
</html>
